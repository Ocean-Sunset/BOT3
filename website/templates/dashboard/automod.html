{% extends "dashboard/base.html" %}
{% block content %}
<link rel="stylesheet" href="/static/moderation.css?v=19" />
<link rel="stylesheet" href="/static/automod.css?v=6" />
<div id="automod-wrap">

  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem;flex-wrap:wrap;gap:0.75rem;animation-delay:.05s;">
    <div>
      <h1 style="font-size:26px;font-weight:900;letter-spacing:-0.03em;line-height:1.05;">AutoMod</h1>
      <p style="color:rgba(255,255,255,0.5);font-size:14px;font-weight:600;margin-top:4px;">Automated moderation and content filtering</p>
    </div>
    <label class="md-toggle md-toggle-xl"><input type="checkbox" id="am-enabled" /><span class="md-toggle-slider"></span></label>
  </div>

  <div class="md-section">
    <div style="border:1px solid rgba(255,255,255,0.08);border-radius:4px;background:rgba(255,255,255,0.015);padding:1rem;">
      <div class="md-section-title">AutoMod</div>
      <div class="md-behavior-list">
        <div class="md-behavior-item">
          <div style="flex:1">
            <div class="md-behavior-label">Moderation Channel</div>
            <div class="md-behavior-desc">Where AutoMod actions get posted</div>
            <div class="md-custom-select" id="am-modchannel-wrap">
              <button class="md-custom-select-btn" id="am-modchannel-btn">Select channel...</button>
              <div class="md-custom-select-drop" id="am-modchannel-drop"></div>
            </div>
          </div>
        </div>
        <div class="md-behavior-item">
          <div style="flex:1">
            <div class="md-behavior-label">Mute Duration (minutes)</div>
            <div class="md-behavior-desc">How long a "mute" action lasts</div>
            <input type="number" class="md-input" data-key="filter_mute_minutes" min="1" placeholder="60" />
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="md-section">
    <div class="am-filters" id="filter-list">
      <div style="text-align:center;padding:1.5rem;color:rgba(255,255,255,0.25);font-size:0.8rem;">Loading...</div>
    </div>
  </div>

</div>

<div class="md-modal-overlay" id="am-config-modal">
  <div class="md-modal" style="max-width:440px;">
    <h3 id="am-config-title">Configure</h3>
    <div style="font-size:0.72rem;color:rgba(255,255,255,0.35);margin:0.2rem 0 0.75rem;line-height:1.5;" id="am-config-sub"></div>
    <div id="am-config-fields" style="display:flex;flex-direction:column;gap:0.6rem;"></div>
    <div style="display:flex;gap:0.5rem;margin-top:0.9rem;">
      <button class="md-action-btn" id="am-config-save" style="flex:1;justify-content:center;background:rgba(255,255,255,0.1);color:#e9edf5;">Save</button>
      <button class="md-action-btn" id="am-config-cancel" style="flex:1;justify-content:center;color:rgba(255,255,255,0.4);">Cancel</button>
    </div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
const GID = window.__GUILD_ID;
const api = (path, opts) => fetch(`/api/v1/automod/${GID}${path}`, opts||{}).then(r=>r.json());
const esc = s => { const d=document.createElement('div'); d.textContent=s||''; return d.innerHTML; };

const ACTIONS = [
  { value:'delete', label:'Delete Message' },
  { value:'delete_dm', label:'Delete Message + DM' },
  { value:'warn', label:'Warn' },
  { value:'warn_dm', label:'Warn + DM' },
  { value:'mute', label:'Mute' },
  { value:'mute_dm', label:'Mute + DM' },
  { value:'kick', label:'Kick' },
  { value:'kick_dm', label:'Kick + DM' },
  { value:'ban', label:'Ban' },
  { value:'ban_dm', label:'Ban + DM' },
];

const FILTERS = [
  { key:'profanity', name:'Profanity Filter', desc:'Blocks common bad words plus your custom list', fields:[{type:'text', key:'profanity_words', label:'Custom Words', placeholder:'word, another, word'}] },
  { key:'spam', name:'Spam Detection', desc:'Flags rapid repeated messages', fields:[{type:'number', key:'spam_messages', label:'Max Messages', min:2, ph:'5'},{type:'number', key:'spam_window', label:'Window (seconds)', min:1, ph:'5'}] },
  { key:'links', name:'Link Filter', desc:'Blocks links in messages (with allowlist)', fields:[{type:'text', key:'links_allowlist', label:'Allowed Domains', placeholder:'example.com, github.com'}] },
  { key:'caps', name:'Caps Lock', desc:'Flags messages that are mostly uppercase', fields:[{type:'number', key:'caps_percent', label:'Caps %', min:1, ph:'70'},{type:'number', key:'caps_min_chars', label:'Min Characters', min:3, ph:'6'}] },
  { key:'mentions', name:'Mention Spam', desc:'Flags messages with too many mentions', fields:[{type:'number', key:'mentions_max', label:'Max Mentions', min:1, ph:'5'}] },
  { key:'invites', name:'Invite Links', desc:'Blocks Discord invite links', fields:[] },
  { key:'zalgo', name:'Zalgo Text', desc:'Blocks glitch / combining characters', fields:[] },
  { key:'emoji', name:'Emoji Spam', desc:'Flags messages with too many emojis', fields:[{type:'number', key:'emoji_max', label:'Max Emojis', min:1, ph:'10'}] },
];

const pending = {};
const original = {};
let SETTINGS_SNAPSHOT = {};
let LOADED = {};
let CHANNELS = [];
const saveBar = document.getElementById('save-bar');
const saveBtn = document.getElementById('save-btn');
let saveTimer = null;

function markChanged(key, value) {
  if (!(key in original)) original[key] = (key in SETTINGS_SNAPSHOT) ? SETTINGS_SNAPSHOT[key] : !value;
  pending[key] = value;
  SETTINGS_SNAPSHOT[key] = value;
  saveBar.classList.remove('is-closed');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => saveBar.classList.add('is-closed'), 60000);
  updateDisabledState();
}

function updateDisabledState() {
  document.getElementById('automod-wrap').classList.toggle('is-disabled', !document.getElementById('am-enabled').checked);
}

function actionLabel(v) {
  const a = ACTIONS.find(x => x.value === v);
  return a ? a.label : 'Delete Message';
}

// ── Action config popup ──
let cfgFilter = null;
let cfgAction = null;

function collectCfgEmbed() {
  const get = id => document.getElementById(id)?.value ?? '';
  const e = {
    title: get('am-ee-title'), description: get('am-ee-desc'), url: get('am-ee-url'),
    color: get('am-ee-color-hex'),
    author_name: get('am-ee-author'), footer_text: get('am-ee-footer'),
    thumbnail_url: get('am-ee-thumb'), image_url: get('am-ee-image'),
  };
  for (const k of ['title','description','url','author_name','footer_text','thumbnail_url','image_url']) if (!e[k]) delete e[k];
  if (!e.color || e.color.toLowerCase() === '#5865f2') delete e.color;
  return e;
}

function embedField(label, id, ph, v) {
  return '<div class="am-field-label" style="margin-top:0.6rem;">' + esc(label) + '</div>' +
    '<input type="text" class="md-input" id="' + id + '" value="' + esc(v ?? '') + '" placeholder="' + esc(ph||'') + '" style="width:100%;" />';
}

function openConfig(filterKey, action) {
  // Config lives on the base action (warn_dm -> warn); every base is configurable
  const act = String(action || '');
  const base = act.replace(/_dm$/, '');
  if (!['delete', 'warn', 'mute', 'kick', 'ban'].includes(base)) return;
  cfgFilter = filterKey;
  cfgAction = base;
  const f = FILTERS.find(x => x.key === filterKey);
  document.getElementById('am-config-title').textContent = 'Configure ' + actionLabel(action);
  document.getElementById('am-config-sub').textContent = f ? f.name + ' - ' + f.desc : '';
  const cur = (SETTINGS_SNAPSHOT.action_configs || {})[filterKey] || {};
  const el = document.getElementById('am-config-fields');
  const isDm = act.endsWith('_dm');
  const muteMins = (base === 'mute') ? '<div class="am-field-label" style="margin-top:0.6rem;">Mute Duration (minutes)</div>' +
    '<input type="number" class="md-input" data-cfg="mute_minutes" min="1" value="' + esc(cur.mute_minutes ?? 60) + '" style="width:100%;" />' : '';
  const banDays = (base === 'ban') ? '<div class="am-field-label" style="margin-top:0.6rem;">Delete Messages (days)</div>' +
    '<input type="number" class="md-input" data-cfg="ban_days" min="0" max="7" value="' + esc(cur.ban_days ?? 0) + '" style="width:100%;" />' : '';
  const LBL = {
    delete: ['DM Message', 'Message sent to the user instead of the default'],
    warn:   ['Warn Message', isDm ? 'Message sent to the warned user' : 'Reason shown in the mod log'],
    mute:   ['Mute Message', 'Message sent to the muted user'],
    kick:   ['Kick Message', isDm ? 'Message sent to the kicked user' : 'Reason attached to the kick'],
    ban:    ['Ban Message', isDm ? 'Message sent to the banned user' : 'Reason attached to the ban'],
  }[base] || ['Message', ''];
  const mode = cur[base + '_mode'] === 'custom' ? 'custom' : 'basic';
  const msg = cur[base + '_message'] || '';
  const emb = cur[base + '_embed'] || {};
  const hex = (emb.color && !/^#/.test(String(emb.color))) ? '#' + emb.color : (emb.color || '#5865f2');
  el.innerHTML =
    muteMins +
    '<div class="am-mode-row">' +
      '<button type="button" class="am-mode-tab" data-am-mode="basic">Basic Message</button>' +
      '<button type="button" class="am-mode-tab" data-am-mode="custom">Custom Embed</button>' +
    '</div>' +
    '<div data-am-view="basic">' +
      '<div class="am-field-label">' + LBL[0] + '</div>' +
      '<input type="text" class="md-input" data-cfg="' + base + '_message" value="' + esc(msg) + '" placeholder="' + esc(LBL[1]) + '" style="width:100%;" />' +
      banDays +
    '</div>' +
    '<div data-am-view="custom" style="display:none;">' +
      embedField('Title', 'am-ee-title', 'Embed title', emb.title) +
      embedField('Description', 'am-ee-desc', 'Embed description', emb.description) +
      '<div class="am-field-label" style="margin-top:0.6rem;">Color</div>' +
      '<div style="display:flex;align-items:center;gap:0.4rem;">' +
        '<input type="color" id="am-ee-color" value="' + esc(/^#[0-9a-fA-F]{6}$/.test(hex) ? hex : '#5865f2') + '" style="width:36px;height:32px;border:none;background:none;cursor:pointer;" />' +
        '<input type="text" class="md-input" id="am-ee-color-hex" value="' + esc(hex) + '" style="max-width:90px;" />' +
      '</div>' +
      embedField('URL', 'am-ee-url', 'https://...', emb.url) +
      embedField('Author Name', 'am-ee-author', 'Author', emb.author_name) +
      embedField('Footer Text', 'am-ee-footer', 'Footer', emb.footer_text) +
      embedField('Thumbnail URL', 'am-ee-thumb', 'https://...png', emb.thumbnail_url) +
      embedField('Image URL', 'am-ee-image', 'https://...png', emb.image_url) +
      banDays +
    '</div>';
  // Bind mode tabs + color sync
  el.querySelectorAll('.am-mode-tab').forEach(b => b.addEventListener('click', () => {
    el.querySelectorAll('.am-mode-tab').forEach(x => x.classList.toggle('is-active', x === b));
    el.querySelector('[data-am-view="basic"]').style.display = b.dataset.amMode === 'basic' ? '' : 'none';
    el.querySelector('[data-am-view="custom"]').style.display = b.dataset.amMode === 'custom' ? '' : 'none';
  }));
  const hexEl = document.getElementById('am-ee-color-hex');
  const colEl = document.getElementById('am-ee-color');
  if (hexEl && colEl) {
    hexEl.addEventListener('input', () => { if (/^#[0-9a-fA-F]{6}$/.test(hexEl.value)) colEl.value = hexEl.value; });
    colEl.addEventListener('input', () => { hexEl.value = colEl.value; });
  }
  document.getElementById('am-config-modal').classList.add('is-open');
}

function saveConfig() {
  if (!cfgFilter) return;
  const obj = {};
  const mode = document.querySelector('.am-mode-tab.is-active')?.dataset.amMode || 'basic';
  obj[cfgAction + '_mode'] = mode;
  const msgInp = document.querySelector('[data-cfg="' + cfgAction + '_message"]');
  if (msgInp && msgInp.value) obj[cfgAction + '_message'] = msgInp.value;
  if (mode === 'custom') {
    const e = collectCfgEmbed();
    if (Object.keys(e).length) obj[cfgAction + '_embed'] = e;
  }
  if (cfgAction === 'mute') {
    const inp = document.querySelector('[data-cfg="mute_minutes"]');
    obj.mute_minutes = inp ? (parseInt(inp.value) || 60) : 60;
  }
  const days = document.querySelector('[data-cfg="ban_days"]');
  if (days) obj.ban_days = parseInt(days.value) || 0;
  const all = { ...(SETTINGS_SNAPSHOT.action_configs || {}) };
  all[cfgFilter] = obj;
  markChanged('action_configs', all);
  document.getElementById('am-config-modal').classList.remove('is-open');
  if (typeof showToast === 'function') showToast('Action config saved - press Save to confirm.', 'info');
}

function renderFilters() {
  const el = document.getElementById('filter-list');
  el.innerHTML = FILTERS.map(f => {
    const en = SETTINGS_SNAPSHOT[f.key + '_enabled'] === true;
    const act = SETTINGS_SNAPSHOT[f.key + '_action'] || 'delete';
    const cfgVisible = act !== 'delete';
    return '<div class="am-filter">' +
      '<div class="am-filter-head">' +
        '<label class="md-toggle"><input type="checkbox" data-enable="' + f.key + '" ' + (en?'checked':'') + ' /><span class="md-toggle-slider"></span></label>' +
        '<div class="am-filter-info"><div class="am-filter-name">' + esc(f.name) + '</div><div class="am-filter-desc">' + esc(f.desc) + '</div></div>' +
        '<button type="button" class="am-cfg-btn" data-config="' + f.key + '" data-tooltip="Configure ' + actionLabel(act) + '" ' + (cfgVisible ? '' : 'style="display:none"') + '><i data-lucide="square-pen"></i></button>' +
        '<div class="md-custom-select am-action-select">' +
          '<button class="md-custom-select-btn" data-action="' + f.key + '">' + actionLabel(act) + '</button>' +
          '<div class="md-custom-select-drop" data-action="' + f.key + '">' +
            ACTIONS.map(a => '<button class="md-custom-opt" data-value="' + a.value + '">' + a.label + '</button>').join('') +
          '</div>' +
        '</div>' +
      '</div>' +
      (f.fields.length ? '<div class="am-filter-fields">' + f.fields.map(fd =>
        '<div class="am-field"><div class="am-field-label">' + esc(fd.label) + '</div>' +
        '<input type="' + fd.type + '" class="md-input" data-field="' + fd.key + '" min="' + (fd.min||'') + '" value="' + esc(SETTINGS_SNAPSHOT[fd.key] ?? '') + '" placeholder="' + esc(fd.ph||'') + '" /></div>'
      ).join('') + '</div>' : '') +
    '</div>';
  }).join('');
  bindFilters();
  if (typeof lucide !== 'undefined') lucide.createIcons();
}

function bindFilters() {
  document.querySelectorAll('[data-enable]').forEach(cb => cb.addEventListener('change', function(){
    markChanged(this.dataset.enable + '_enabled', this.checked);
  }));
  document.querySelectorAll('[data-field]').forEach(inp => inp.addEventListener('input', function(){
    markChanged(this.dataset.field, inp.type === 'number' ? (parseInt(inp.value)||0) : inp.value);
  }));
  document.querySelectorAll('.am-action-select .md-custom-select-btn').forEach(btn => btn.addEventListener('click', (e) => {
    e.stopPropagation();
    const drop = btn.nextElementSibling;
    document.querySelectorAll('.md-custom-select-drop').forEach(d => { if (d !== drop) d.classList.remove('is-open'); });
    drop.classList.toggle('is-open');
  }));
  document.querySelectorAll('.am-action-select .md-custom-opt').forEach(opt => opt.addEventListener('click', () => {
    const drop = opt.closest('.md-custom-select-drop');
    const btn = drop.previousElementSibling;
    const key = btn.dataset.action + '_action';
    btn.textContent = opt.textContent;
    markChanged(key, opt.dataset.value);
    drop.classList.remove('is-open');
    // Show/hide the configure button based on the new action (everything but plain delete)
    const card = drop.closest('.am-filter');
    const cfgBtn = card.querySelector('.am-cfg-btn');
    const newVisible = opt.dataset.value !== 'delete';
    if (cfgBtn) cfgBtn.style.display = newVisible ? '' : 'none';
  }));
  document.querySelectorAll('.am-cfg-btn').forEach(b => b.addEventListener('click', (e) => {
    e.stopPropagation();
    const f = FILTERS.find(x => x.key === b.dataset.config);
    openConfig(b.dataset.config, f ? (SETTINGS_SNAPSHOT[f.key + '_action'] || 'delete') : 'delete');
  }));
  document.addEventListener('click', (e) => {
    if (!e.target.closest('.am-action-select')) document.querySelectorAll('.md-custom-select-drop').forEach(d => d.classList.remove('is-open'));
  });
}

async function saveChanges() {
  const keys = Object.keys(pending);
  if (!keys.length) return;
  saveBtn.disabled = true;
  saveBtn.textContent = 'Saving...';
  for (const key of keys) {
    try {
      const res = await fetch(`/api/v1/automod/${GID}/settings`, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({key, value:pending[key]}) });
      if (!res.ok) {
        let detail = 'Save failed';
        try { const j = await res.json(); detail = j.detail || j.error || detail; } catch {}
        if (typeof showToast === 'function') showToast(detail, 'error', 5000);
        return;
      }
    } catch (e) {
      if (typeof showToast === 'function') showToast('Network error saving.', 'error', 5000);
      return;
    }
  }
  for (const key of keys) { LOADED[key] = pending[key]; delete original[key]; delete pending[key]; }
  saveBar.classList.add('is-closed');
  saveBtn.disabled = false;
  saveBtn.textContent = 'Save';
  if (typeof showToast === 'function') showToast('AutoMod settings saved.', 'success');
}

document.addEventListener('DOMContentLoaded', () => {
  Promise.all([
    api('/settings').catch(()=>({settings:{}})),
    api('/channels').catch(()=>({channels:[]})),
  ]).then(([sd, cd]) => {
    SETTINGS_SNAPSHOT = { ...(sd.settings||{}) };
    LOADED = { ...SETTINGS_SNAPSHOT };
    CHANNELS = cd.channels || [];
    const enabled = document.getElementById('am-enabled');
    enabled.checked = SETTINGS_SNAPSHOT.enabled === true;
    enabled.addEventListener('change', function(){ markChanged('enabled', this.checked); });
    const t = document.querySelector('[data-key="filter_mute_minutes"]');
    if (t) t.value = SETTINGS_SNAPSHOT.filter_mute_minutes ?? 60;
    t.addEventListener('input', function(){ markChanged('filter_mute_minutes', parseInt(this.value)||0); });

    // Moderation channel dropdown
    const mBtn = document.getElementById('am-modchannel-btn');
    const mDrop = document.getElementById('am-modchannel-drop');
    if (mBtn && mDrop) {
      mDrop.innerHTML = '<button class="md-custom-opt" data-id="">None</button>' + CHANNELS.map(c => '<button class="md-custom-opt" data-id="' + c.id + '">#' + esc(c.name) + '</button>').join('');
      const cur = SETTINGS_SNAPSHOT.moderation_channel_id;
      const match = CHANNELS.find(c => String(c.id) === String(cur));
      if (match) mBtn.textContent = '#' + match.name;
      mBtn.addEventListener('click', (e) => { e.stopPropagation(); mDrop.classList.toggle('is-open'); });
      mDrop.querySelectorAll('.md-custom-opt').forEach(opt => opt.addEventListener('click', () => {
        mBtn.textContent = opt.dataset.id ? '#' + opt.textContent.replace(/^#/, '') : 'None';
        markChanged('moderation_channel_id', opt.dataset.id || null);
        mDrop.classList.remove('is-open');
      }));
      document.addEventListener('click', (e) => { if(!e.target.closest('#am-modchannel-wrap')) mDrop.classList.remove('is-open'); });
    }

    renderFilters();
    updateDisabledState();
  });

  saveBtn.addEventListener('click', saveChanges);
  const cfgModal = document.getElementById('am-config-modal');
  document.getElementById('am-config-save').addEventListener('click', saveConfig);
  document.getElementById('am-config-cancel').addEventListener('click', () => cfgModal.classList.remove('is-open'));
  cfgModal.addEventListener('click', e => { if (e.target === cfgModal) cfgModal.classList.remove('is-open'); });
  document.getElementById('discard-btn').addEventListener('click', () => {
    const reverted = { ...LOADED };
    for (const key of Object.keys(pending)) {
      if (key in original) reverted[key] = original[key];
    }
    for (const key of Object.keys(pending)) delete pending[key];
    for (const key of Object.keys(original)) delete original[key];
    SETTINGS_SNAPSHOT = { ...reverted };
    document.getElementById('am-enabled').checked = SETTINGS_SNAPSHOT.enabled === true;
    const t = document.querySelector('[data-key="filter_mute_minutes"]');
    if (t) t.value = SETTINGS_SNAPSHOT.filter_mute_minutes ?? 60;
    const mBtn = document.getElementById('am-modchannel-btn');
    if (mBtn) {
      const match = CHANNELS.find(c => String(c.id) === String(reverted.moderation_channel_id));
      mBtn.textContent = match ? '#' + match.name : 'Select channel...';
    }
    renderFilters();
    updateDisabledState();
    saveBar.classList.add('is-closed');
  });
});
</script>
{% endblock %}
