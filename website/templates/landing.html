<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prowl — We're Building Something</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0a;
      color: #fff;
      font-family: 'Inter', system-ui, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      align-items: center;
    }

    .hero {
      padding: 0 6vw;
      width: 100%;
    }

    .hero-line {
      font-size: clamp(2.8rem, 7vw, 7rem);
      font-weight: 900;
      line-height: 1.15;
      letter-spacing: -0.03em;
      color: #fff;
    }

    .hero-line .scramble-word {
      display: inline-block;
      color: #fff;
    }

    .sub-text {
      margin-top: 1.5rem;
      font-size: clamp(0.9rem, 1.2vw, 1.1rem);
      color: #666;
      font-weight: 500;
      letter-spacing: 0.01em;
    }

    /* Tilde background */
    .wave-field {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    .wave-field span {
      position: absolute;
      color: rgba(255, 255, 255, 0.04);
      font-family: monospace;
      user-select: none;
      line-height: 1;
    }

    /* Vignette */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 40%, #0a0a0a 100%);
      pointer-events: none;
    }

    @media (max-width: 768px) {
      .hero {
        text-align: center;
        padding: 0 1.5rem;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
    }
  </style>
</head>
<body>

  <div class="wave-field" id="wave-field"></div>

  <div class="hero">
    <div class="hero-line gsap-line-1">We're building</div>
    <div class="hero-line gsap-line-2">
      <span class="scramble-word" id="scramble-target">something</span>.
    </div>
    <div class="sub-text gsap-sub">Prowl — Discord bot &amp; dashboard.</div>
  </div>

  <script>
    const target = document.getElementById('scramble-target');
    const finalWord = 'something';
    const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*';

    function scrambleEffect(el, word, duration) {
      const iterations = Math.ceil(duration / 30);
      let current = 0;

      const interval = setInterval(() => {
        el.textContent = word
          .split('')
          .map((char, i) => {
            if (i < current) return word[i];
            return chars[Math.floor(Math.random() * chars.length)];
          })
          .join('');

        current += word.length / iterations;

        if (current >= word.length) {
          el.textContent = word;
          clearInterval(interval);
        }
      }, 30);
    }

    // ── Scatter tildes ──
    const waveField = document.getElementById('wave-field');
    const tildeCount = window.innerWidth < 768 ? 30 : 60;

    for (let i = 0; i < tildeCount; i++) {
      const el = document.createElement('span');
      el.textContent = '~';
      el.style.left = Math.random() * 100 + '%';
      el.style.top = Math.random() * 100 + '%';
      el.style.fontSize = (0.8 + Math.random() * 1.4) + 'rem';
      el.style.opacity = 0.02 + Math.random() * 0.06;
      waveField.appendChild(el);

      gsap.to(el, {
        y: -15 + Math.random() * 30,
        x: -10 + Math.random() * 20,
        duration: 4 + Math.random() * 6,
        ease: 'sine.inOut',
        yoyo: true,
        repeat: -1,
        delay: Math.random() * 3,
      });
    }

    gsap.set('.gsap-line-1', { opacity: 0, y: 40, clipPath: 'inset(100% 0 0 0)' });
    gsap.set('.gsap-line-2', { opacity: 0, y: 40, clipPath: 'inset(100% 0 0 0)' });
    gsap.set('.gsap-sub', { opacity: 0, y: 20 });

    const tl = gsap.timeline({ defaults: { ease: 'power4.out' } });

    tl
      .to('.gsap-line-1', {
        opacity: 1, y: 0, clipPath: 'inset(0% 0 0 0)', duration: 0.8
      }, 0.2)
      .to('.gsap-line-2', {
        opacity: 1, y: 0, clipPath: 'inset(0% 0 0 0)', duration: 0.8,
        onStart: () => {
          setTimeout(() => scrambleEffect(target, finalWord, 1200), 300);
        }
      }, 0.5)
      .to('.gsap-sub', { opacity: 1, y: 0, duration: 0.6 }, 1.0);
  </script>
</body>
</html>
