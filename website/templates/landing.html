<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prowl - We're Building Something</title>
  <meta name="description" content="prowl is your next discord bot! designed to do everything easily without any issues, its made to tackle every problem with ease. from moderation and ai to music, leveling, and a full web dashboard" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="icon" href="/static/favicon.png" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <link rel="stylesheet" href="/static/landing.css" />
</head>
<body>

  <div class="wave-field" id="wave-field"></div>
  <div class="vignette"></div>

  <div class="hero">
    <div class="hero-left">
      <div class="hero-line gsap-line-1">we're building</div>
      <div class="hero-line gsap-line-2">
        <span class="scramble-word" id="scramble-target">something</span>.
      </div>
      <div class="sub-text gsap-sub">Prowl - cool cat discord bot &amp; with a dashboard</div>
    </div>
    <div class="hero-right gsap-sub">
      <div class="status-box">
        <div class="status-header">
          <span class="status-dot"></span>
          <span class="status-label">Project Status</span>
        </div>
        <div class="status-content">
          <!-- EDIT YOUR STATUS BELOW -->
          <p class="status-text">We're making good progress on the dashboard! Moderation is live, more features coming soon.</p>
          <div class="status-date">Last updated: Jul 16, 2026</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ── Scatter tildes ──
    const waveField = document.getElementById('wave-field');
    const isMobile = window.innerWidth < 768;
    const tildeCount = isMobile ? 35 : 70;

    for (let i = 0; i < tildeCount; i++) {
      const el = document.createElement('span');
      el.textContent = '~';
      el.style.left = Math.random() * 100 + '%';
      el.style.top = Math.random() * 100 + '%';
      el.style.fontSize = (1 + Math.random() * 1.8) + 'rem';
      el.style.opacity = 0.04 + Math.random() * 0.1;
      waveField.appendChild(el);

      gsap.to(el, {
        y: -20 + Math.random() * 40,
        x: -12 + Math.random() * 24,
        duration: 4 + Math.random() * 6,
        ease: 'sine.inOut',
        yoyo: true,
        repeat: -1,
        delay: Math.random() * 4,
      });
    }

    // ── Word scramble ──
    const target = document.getElementById('scramble-target');
    const finalWord = 'something';
    const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*';

    function scrambleEffect(el, word, duration) {
      const iterations = Math.ceil(duration / 30);
      let current = 0;

      const interval = setInterval(() => {
        el.textContent = word
          .split('')
          .map((char, i) => {
            if (i < current) return word[i];
            return chars[Math.floor(Math.random() * chars.length)];
          })
          .join('');

        current += word.length / iterations;

        if (current >= word.length) {
          el.textContent = word;
          clearInterval(interval);
        }
      }, 30);
    }

    // ── Start scramble immediately, don't wait for reveal ──
    scrambleEffect(target, finalWord, 1200);

    // ── GSAP timeline ──
    gsap.set('.gsap-line-1', { opacity: 0, y: 40, clipPath: 'inset(100% 0 0 0)' });
    gsap.set('.gsap-line-2', { opacity: 0, y: 40, clipPath: 'inset(100% 0 0 0)' });
    gsap.set('.gsap-sub', { opacity: 0, y: 20 });

    const tl = gsap.timeline({ defaults: { ease: 'power4.out' } });

    tl
      .to('.gsap-line-1', {
        opacity: 1, y: 0, clipPath: 'inset(0% 0 0 0)', duration: 0.8
      }, 0.2)
      .to('.gsap-line-2', {
        opacity: 1, y: 0, clipPath: 'inset(0% 0 0 0)', duration: 0.8
      }, 0.5)
      .to('.gsap-sub', { opacity: 1, y: 0, duration: 0.6 }, 1.0);
  </script>
</body>
</html>
