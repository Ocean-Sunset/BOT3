<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASCII Wave</title>

<style>
    * {
        box-sizing: border-box;
    }

    html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #050505;
    }

    canvas {
        display: block;
        width: 100%;
        height: 100%;
    }
</style>
</head>

<body>

<canvas id="wave"></canvas>

<script>
const canvas = document.getElementById("wave");
const ctx = canvas.getContext("2d");

const chars = " .:-=+*#%@";

// Mintlify-ish palette.
// Change these to whatever you want.
const colors = [
    "#001524",
    "#15616d",
    "#ff7d00",
    "#78290f"
];

const fontSize = 14;
const cellWidth = 8;
const cellHeight = 16;

let width;
let height;
let columns;
let rows;

function resize() {
    const dpr = window.devicePixelRatio || 1;

    width = window.innerWidth;
    height = window.innerHeight;

    canvas.width = width * dpr;
    canvas.height = height * dpr;

    canvas.style.width = width + "px";
    canvas.style.height = height + "px";

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    columns = Math.ceil(width / cellWidth);
    rows = Math.ceil(height / cellHeight);
}

function lerp(a, b, t) {
    return a + (b - a) * t;
}

function lerpColor(a, b, t) {
    const ah = a.replace("#", "");
    const bh = b.replace("#", "");

    const ar = parseInt(ah.substring(0, 2), 16);
    const ag = parseInt(ah.substring(2, 4), 16);
    const ab = parseInt(ah.substring(4, 6), 16);

    const br = parseInt(bh.substring(0, 2), 16);
    const bg = parseInt(bh.substring(2, 4), 16);
    const bb = parseInt(bh.substring(4, 6), 16);

    return `rgb(
        ${Math.round(lerp(ar, br, t))},
        ${Math.round(lerp(ag, bg, t))},
        ${Math.round(lerp(ab, bb, t))}
    )`;
}

function paletteColor(t) {
    t = ((t % 1) + 1) % 1;

    const scaled = t * (colors.length - 1);
    const index = Math.min(
        Math.floor(scaled),
        colors.length - 2
    );

    return lerpColor(
        colors[index],
        colors[index + 1],
        scaled - index
    );
}

function waveValue(x, y, time) {
    // Main diagonal wave
    const wave1 =
        Math.sin(x * 0.055 + time * 1.1) *
        0.55;

    // Secondary wave
    const wave2 =
        Math.sin(y * 0.09 - time * 0.8 + x * 0.018) *
        0.30;

    // Large slow-moving wave
    const wave3 =
        Math.sin(
            Math.sqrt(
                x * x +
                y * y
            ) * 0.025 - time * 0.65
        ) *
        0.35;

    // Tiny interference pattern
    const wave4 =
        Math.sin(
            x * 0.025 +
            y * 0.04 +
            time * 1.5
        ) *
        0.15;

    return wave1 + wave2 + wave3 + wave4;
}

function draw(time) {
    time *= 0.001;

    ctx.fillStyle = "#050505";
    ctx.fillRect(0, 0, width, height);

    ctx.font = `${fontSize}px Menlo, Monaco, Consolas, monospace`;
    ctx.textBaseline = "top";

    for (let y = 0; y < rows; y++) {
        for (let x = 0; x < columns; x++) {

            const px = x * cellWidth;
            const py = y * cellHeight;

            let value = waveValue(
                x,
                y,
                time
            );

            /*
             * Make the wave concentrated
             * around a central band.
             */
            value =
                Math.abs(value) *
                1.7;

            value = Math.min(value, 1);

            // Darkness threshold.
            if (value < 0.08) {
                continue;
            }

            const charIndex = Math.min(
                chars.length - 1,
                Math.floor(value * chars.length)
            );

            const char = chars[charIndex];

            if (char === " ") {
                continue;
            }

            /*
             * Slowly cycle through the palette.
             */
            const colorPosition =
                value * 0.65 +
                time * 0.025;

            ctx.fillStyle =
                paletteColor(colorPosition);

            ctx.fillText(
                char,
                px,
                py
            );
        }
    }

    requestAnimationFrame(draw);
}

window.addEventListener("resize", resize);

resize();
requestAnimationFrame(draw);
</script>

</body>
</html>
