<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bot Control Panel</title>
    <style>
        body {
            font-family: system-ui;
            background: #0f0f0f;
            color: #eaeaea;
            padding: 20px;
        }
        button {
            padding: 10px 15px;
            margin: 5px;
            border: none;
            border-radius: 6px;
            background: #5865F2;
            color: white;
            cursor: pointer;
        }
        pre {
            background: #1e1e1e;
            padding: 10px;
            border-radius: 6px;
        }
    </style>
</head>
<body>

<h1>🤖 Bot Control Panel</h1>

<button onclick="getStatus()">Get Status</button>
<button onclick="restartBot()">Restart Bot</button>
<button onclick="fixLevels()">Fix Levels</button>

<pre id="output">Waiting...</pre>

<script>
// Automatically detects the IP and Port of the server it's hosted on
const API_URL = window.location.origin; 
const TOKEN = "d7238d07188af3036c7cdeaf7dd1034269eef41472bcb8a8c1e3ec6072c2a723";

function request(endpoint, method = "GET") {
    return fetch(API_URL + endpoint, {
        method,
        headers: {
            "Authorization": TOKEN,
            "Content-Type": "application/json"
        }
    })
    .then(r => r.json())
    .catch(err => {
        console.error("Connection failed:", err);
        return {error: "Could not connect to bot server"};
    });
}

function getStatus() {
    request("/status").then(show);
}

function restartBot() {
    request("/restart", "POST").then(show);
}

function fixLevels() {
    request("/fix-levels", "POST").then(show);
}

function show(data) {
    document.getElementById("output").textContent =
        JSON.stringify(data, null, 2);
}
</script>

</body>
</html>
