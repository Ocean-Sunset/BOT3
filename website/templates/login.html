<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prowl — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
          colors: {
            surface: { 0: '#0f1117', 1: '#11131b', 2: '#151822', 3: '#191f2d' },
            brand: { DEFAULT: '#7c5cff', light: '#a78bfa' },
          },
        },
      },
    }
  </script>
  <script>
    window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/speed-insights/script.js"></script>
  <style>
    .feature-card { transition: background 0.2s, border-color 0.2s; }
    .feature-card:hover { background: rgba(124,92,255,0.08); border-color: rgba(124,92,255,0.3); }
  </style>
</head>
<body class="bg-surface-0 text-[#e9edf5] font-sans antialiased min-h-screen
             bg-[radial-gradient(1200px_600px_at_30%_20%,rgba(124,92,255,0.14),transparent_60%)]
             flex items-center justify-center p-6">

  <!-- Main card -->
  <div id="card"
       class="w-full max-w-[840px] min-h-[480px] rounded-3xl border border-white/[0.08]
              bg-gradient-to-br from-white/[0.04] to-white/[0.015]
              shadow-[0_20px_60px_rgba(0,0,0,0.5)] overflow-hidden
              grid grid-cols-1 md:grid-cols-2">

    <!-- ==================== LEFT: Actions ==================== -->
    <div class="flex flex-col justify-center px-10 py-12 gap-8">

      <!-- Brand -->
      <div class="flex items-center gap-3 gsap-brand">
        <div class="w-11 h-11 rounded-xl grid place-items-center bg-brand/20 border border-brand/30 shrink-0">
          <i data-lucide="paw-print" class="w-5 h-5 text-brand-light"></i>
        </div>
        <span class="text-xl font-extrabold tracking-tight">Prowl</span>
      </div>

      <!-- Toggle -->
      <div class="gsap-toggle flex items-center gap-1 p-1 rounded-xl bg-white/[0.04] border border-white/[0.06] w-fit">
        <button id="btn-signin" onclick="setMode('signin')"
                class="mode-btn px-4 py-2 rounded-lg text-[13px] font-bold transition-all duration-200 bg-brand/20 text-brand-light border border-brand/25">
          Sign In
        </button>
        <button id="btn-signup" onclick="setMode('signup')"
                class="mode-btn px-4 py-2 rounded-lg text-[13px] font-bold transition-all duration-200 text-white/40 hover:text-white/60 border border-transparent">
          Sign Up
        </button>
      </div>

      <!-- Heading -->
      <div class="gsap-heading">
        <h1 id="heading" class="text-2xl font-black tracking-tight mb-2 overflow-hidden">
          <span class="inline-block">Welcome back</span>
        </h1>
        <p id="subtitle" class="text-white/45 text-sm font-semibold leading-relaxed">
          Sign in to manage your servers and customize Prowl.
        </p>
      </div>

      <!-- Buttons -->
      <div id="buttons" class="gsap-buttons flex flex-col gap-3">
        <a href="/login"
           class="flex items-center justify-center gap-3 px-6 py-3.5 rounded-xl bg-[#5865F2] hover:bg-[#4752C4]
                  text-white font-bold text-[14px] transition-colors duration-200 shadow-lg shadow-[#5865F2]/20">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor">
            <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/>
          </svg>
          Continue with Discord
        </a>
        <a id="google-btn" href="/login/google"
           class="flex items-center justify-center gap-3 px-6 py-3.5 rounded-xl bg-white/[0.06] hover:bg-white/[0.1]
                  border border-white/[0.1] text-white font-bold text-[14px] transition-colors duration-200">
          <svg class="w-5 h-5" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
          </svg>
          Continue with Google
        </a>
      </div>

      <!-- Footer -->
      <p class="gsap-footer text-white/25 text-xs font-semibold">We only access your server list — nothing else.</p>
    </div>

    <!-- ==================== RIGHT: Showcase ==================== -->
    <div class="hidden md:flex flex-col justify-center items-center px-10 py-12
                bg-gradient-to-br from-brand/[0.06] to-transparent border-l border-white/[0.06] relative overflow-hidden">

      <!-- Glow blob -->
      <div id="glow-blob"
           class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-64 h-64 rounded-full
                  bg-brand/[0.08] blur-[80px] pointer-events-none"></div>

      <!-- Central icon -->
      <div id="float-icon" class="relative mb-10">
        <div class="w-20 h-20 rounded-2xl grid place-items-center bg-brand/20 border border-brand/30 relative">
          <i data-lucide="paw-print" class="w-10 h-10 text-brand-light"></i>
        </div>
      </div>

      <!-- Feature cards -->
      <div class="relative grid grid-cols-2 gap-2.5 w-full max-w-[320px]">
        <div class="feature-card gsap-card flex items-center gap-2.5 px-3.5 py-2.5 rounded-xl bg-white/[0.03] border border-white/[0.06]">
          <i data-lucide="shield" class="w-4 h-4 text-emerald-400 shrink-0"></i>
          <span class="text-[12px] font-bold text-white/60">Moderation</span>
        </div>
        <div class="feature-card gsap-card flex items-center gap-2.5 px-3.5 py-2.5 rounded-xl bg-white/[0.03] border border-white/[0.06]">
          <i data-lucide="sparkles" class="w-4 h-4 text-amber-400 shrink-0"></i>
          <span class="text-[12px] font-bold text-white/60">AI</span>
        </div>
        <div class="feature-card gsap-card flex items-center gap-2.5 px-3.5 py-2.5 rounded-xl bg-white/[0.03] border border-white/[0.06]">
          <i data-lucide="music" class="w-4 h-4 text-violet-400 shrink-0"></i>
          <span class="text-[12px] font-bold text-white/60">Music</span>
        </div>
        <div class="feature-card gsap-card flex items-center gap-2.5 px-3.5 py-2.5 rounded-xl bg-white/[0.03] border border-white/[0.06]">
          <i data-lucide="trending-up" class="w-4 h-4 text-cyan-400 shrink-0"></i>
          <span class="text-[12px] font-bold text-white/60">Leveling</span>
        </div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script>
    // ── Initial state: everything hidden ──
    gsap.set('.gsap-brand',     { opacity: 0, y: 16 });
    gsap.set('.gsap-toggle',    { opacity: 0, y: 16 });
    gsap.set('.gsap-heading',   { opacity: 0, y: 16 });
    gsap.set('.gsap-buttons',   { opacity: 0, y: 16 });
    gsap.set('.gsap-footer',    { opacity: 0, y: 12 });
    gsap.set('#card',           { opacity: 0, y: 30 });
    gsap.set('.gsap-card',      { opacity: 0, y: 20 });
    gsap.set('#float-icon',     { opacity: 0, scale: 0.8 });
    gsap.set('#glow-blob',      { opacity: 0, scale: 0.6 });

    // ── Page load timeline ──
    const loadTL = gsap.timeline({ defaults: { ease: 'power3.out' } });

    loadTL
      .to('#card', { opacity: 1, y: 0, duration: 0.7 })
      .to('.gsap-brand', { opacity: 1, y: 0, duration: 0.45 }, '-=0.35')
      .to('.gsap-toggle', { opacity: 1, y: 0, duration: 0.4 }, '-=0.3')
      .to('.gsap-heading', { opacity: 1, y: 0, duration: 0.4 }, '-=0.25')
      .to('.gsap-buttons', { opacity: 1, y: 0, duration: 0.45 }, '-=0.2')
      .to('.gsap-footer', { opacity: 1, y: 0, duration: 0.35 }, '-=0.2')
      .to('#glow-blob', { opacity: 1, scale: 1, duration: 1.2 }, '-=0.6')
      .to('#float-icon', { opacity: 1, scale: 1, duration: 0.5, ease: 'back.out(1.4)' }, '-=0.9')
      .to('.gsap-card', {
          opacity: 1, y: 0, duration: 0.35,
          stagger: 0.08, ease: 'power2.out'
        }, '-=0.5');

    // ── Floating icon loop ──
    gsap.to('#float-icon', {
      y: -10,
      duration: 2,
      ease: 'sine.inOut',
      yoyo: true,
      repeat: -1,
    });

    // ── Glow blob pulse ──
    gsap.to('#glow-blob', {
      opacity: 0.35,
      scale: 1.05,
      duration: 2.5,
      ease: 'sine.inOut',
      yoyo: true,
      repeat: -1,
    });

    // ── Mode toggle ──
    let currentMode = 'signin';

    function setMode(m) {
      if (m === currentMode) return;
      currentMode = m;

      const heading   = document.getElementById('heading');
      const subtitle  = document.getElementById('subtitle');
      const googleBtn = document.getElementById('google-btn');
      const btnSignin = document.getElementById('btn-signin');
      const btnSignup = document.getElementById('btn-signup');

      // Toggle button styles
      if (m === 'signin') {
        btnSignin.className = 'mode-btn px-4 py-2 rounded-lg text-[13px] font-bold transition-colors duration-200 bg-brand/20 text-brand-light border border-brand/25';
        btnSignup.className = 'mode-btn px-4 py-2 rounded-lg text-[13px] font-bold transition-colors duration-200 text-white/40 hover:text-white/60 border border-transparent';
      } else {
        btnSignup.className = 'mode-btn px-4 py-2 rounded-lg text-[13px] font-bold transition-colors duration-200 bg-brand/20 text-brand-light border border-brand/25';
        btnSignin.className = 'mode-btn px-4 py-2 rounded-lg text-[13px] font-bold transition-colors duration-200 text-white/40 hover:text-white/60 border border-transparent';
      }

      // Animate text swap
      const tl = gsap.timeline();
      tl.to(heading, {
        opacity: 0, y: -10, duration: 0.15, ease: 'power2.in',
        onComplete: () => {
          heading.innerHTML = m === 'signin'
            ? '<span class="inline-block">Welcome back</span>'
            : '<span class="inline-block">Create an account</span>';
        }
      })
      .to(heading, { opacity: 1, y: 0, duration: 0.25, ease: 'power2.out' })
      .to(subtitle, {
        opacity: 0, y: -6, duration: 0.12, ease: 'power2.in',
        onComplete: () => {
          subtitle.textContent = m === 'signin'
            ? 'Sign in to manage your servers and customize Prowl.'
            : 'Sign up with Discord to get started with Prowl.';
        }
      }, '-=0.15')
      .to(subtitle, { opacity: 1, y: 0, duration: 0.2, ease: 'power2.out' }, '-=0.05');

      // Google button show/hide
      if (m === 'signin') {
        googleBtn.classList.remove('hidden');
        gsap.fromTo(googleBtn, { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.25, ease: 'power2.out' });
      } else {
        gsap.to(googleBtn, {
          opacity: 0, y: 8, duration: 0.15, ease: 'power2.in',
          onComplete: () => googleBtn.classList.add('hidden')
        });
      }
    }
  </script>
</body>
</html>
