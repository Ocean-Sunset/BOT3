<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prowl — Invite</title>
  <meta name="description" content="prowl is your next discord bot! designed to do everything easily without any issues, its made to tackle every problem with ease. from moderation and ai to music, leveling, and a full web dashboard" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="icon" href="/static/favicon.png" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <link rel="stylesheet" href="/static/landing.css" />
  <style>
    .invite-page { min-height: 100vh; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 6vw; position: relative; z-index: 1; }
    .invite-brand { display: flex; align-items: center; gap: 0.6rem; text-decoration: none; color: #fff; margin-bottom: 2rem; }
    .invite-brand img { width: 32px; height: 32px; object-fit: contain; }
    .invite-brand span { font-size: 1.2rem; font-weight: 800; letter-spacing: -0.02em; }
    .invite-title { font-size: clamp(2.5rem, 6vw, 5rem); font-weight: 900; line-height: 1.1; letter-spacing: -0.04em; }
    .invite-title .gray { color: #999; }
    .invite-title .white { color: #fff; }
    .invite-sub { margin-top: 1.5rem; font-size: clamp(0.9rem, 1.2vw, 1.1rem); color: #666; font-weight: 500; max-width: 480px; line-height: 1.6; }
    .invite-btns { display: flex; align-items: center; gap: 0.75rem; margin-top: 2.5rem; }
    .invite-btn { display: inline-flex; align-items: center; justify-content: center; gap: 0.6rem; padding: 0.85rem 1.4rem; background: rgba(255,255,255,0.06); color: #fff; font-weight: 700; font-size: 0.9rem; font-family: 'Lexend', system-ui, sans-serif; border-radius: 6px; border: 1px solid rgba(255,255,255,0.12); text-decoration: none; transition: all 0.2s; }
    .invite-btn:hover { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.2); transform: translateY(-1px); }
    .invite-btn svg { width: 18px; height: 18px; }
    .invite-btn .soon { font-size: 0.65rem; font-weight: 600; color: rgba(255,255,255,0.35); border: 1px solid rgba(255,255,255,0.12); padding: 0.15rem 0.5rem; border-radius: 999px; text-transform: uppercase; letter-spacing: 0.05em; }
    .invite-btn.soon-btn { opacity: 0.6; cursor: not-allowed; }
    .invite-btn.soon-btn:hover { transform: none; background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.12); }
    .invite-perms { margin-top: 1.5rem; font-size: 0.75rem; color: rgba(255,255,255,0.25); font-weight: 500; }
    .invite-back { display: inline-block; margin-top: 1rem; font-size: 0.8rem; color: #555; text-decoration: none; font-weight: 600; transition: color 0.2s; }
    .invite-back:hover { color: #888; }
  </style>
</head>
<body>

  <div class="wave-field" id="wave-field"></div>
  <div class="vignette"></div>

  <div class="invite-page">
    <a href="/" class="invite-brand gsap-brand">
      <img src="/static/favicon.png" alt="Prowl" />
      <span>Prowl</span>
    </a>
    <h1 class="invite-title gsap-title"><span class="gray">Invite</span> <span class="white">Prowl</span></h1>
    <p class="invite-sub gsap-sub">Add the coolest cat bot to your server. Moderation, AI, music, leveling, and more — all in one.</p>
    <div class="invite-btns">
      <a href="https://discord.com/oauth2/authorize?client_id={{ config.get('CLIENT_ID', '') }}&scope=bot%20applications.commands&permissions=8"
         target="_blank" class="invite-btn gsap-btn">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/>
        </svg>
        Add to Discord
      </a>
      <button class="invite-btn soon-btn gsap-btn" disabled>
        <img src="https://img.itch.zone/aW1nLzE1OTU3OTMzLnBuZw==/original/ocCxEs.png" alt="Nerimity" style="width:18px;height:18px;object-fit:contain;" />
        Add to Nerimity <span class="soon">Soon</span>
      </button>
    </div>
    <div class="invite-perms gsap-btn">Requires: Manage Server · Manage Roles · Kick · Ban · Timeout</div>
    <a href="/" class="invite-back gsap-btn">← Back to home</a>
  </div>

  <script>
    // ── Tildes ──
    const waveField = document.getElementById('wave-field');
    const isMobile = window.innerWidth < 768;
    const tildeCount = isMobile ? 35 : 70;
    for (let i = 0; i < tildeCount; i++) {
      const el = document.createElement('span');
      el.textContent = '~';
      el.style.left = Math.random() * 100 + '%';
      el.style.top = Math.random() * 100 + '%';
      el.style.fontSize = (1 + Math.random() * 1.8) + 'rem';
      el.style.opacity = 0.04 + Math.random() * 0.1;
      waveField.appendChild(el);
      gsap.to(el, { y: -20 + Math.random() * 40, x: -12 + Math.random() * 24, duration: 4 + Math.random() * 6, ease: 'sine.inOut', yoyo: true, repeat: -1, delay: Math.random() * 4 });
    }

    // ── Load animation ──
    gsap.set('.gsap-brand', { opacity: 0, y: 20 });
    gsap.set('.gsap-title', { opacity: 0, y: 30 });
    gsap.set('.gsap-sub', { opacity: 0, y: 20 });
    gsap.set('.gsap-btn', { opacity: 0, y: 20 });

    const tl = gsap.timeline({ defaults: { ease: 'power3.out' } });
    tl.to('.gsap-brand', { opacity: 1, y: 0, duration: 0.5 })
      .to('.gsap-title', { opacity: 1, y: 0, duration: 0.6 }, '-=0.3')
      .to('.gsap-sub', { opacity: 1, y: 0, duration: 0.5 }, '-=0.35')
      .to('.gsap-btn', { opacity: 1, y: 0, duration: 0.5, stagger: 0.1 }, '-=0.3');
  </script>
</body>
</html>
