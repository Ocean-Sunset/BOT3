name: Build deploy-bot branch

# Whenever the bot code changes on website, rebuild the `deploy-bot` branch
# so it contains ONLY the cli/ contents at the repo root. Point hidencloud's
# "update from GitHub" at this branch and it always matches the latest bot.

on:
  push:
    branches: [website]
    paths: ['cli/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble deploy tree
        run: |
          rm -rf /tmp/deploy
          mkdir -p /tmp/deploy
          cp -r cli/. /tmp/deploy/
          rm -rf /tmp/deploy/__pycache__

      - name: Rebuild deploy-bot branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git branch -D deploy-bot 2>/dev/null || true
          git checkout --orphan deploy-bot
          find . -maxdepth 1 ! -name . ! -name .git -exec rm -rf {} +
          cp -r /tmp/deploy/. .
          git add -A
          if git diff --cached --quiet; then
            echo "No changes - skipping push"
            exit 0
          fi
          git commit -m "Deploy bot build from website @ $(git rev-parse website)"
          git push --force origin deploy-bot
