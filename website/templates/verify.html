<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verify — Prowl</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0a;
      color: #fff;
      font-family: 'Lexend', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .card {
      width: 100%;
      max-width: 420px;
      border: 1px solid rgba(255,255,255,0.1);
      background: #111;
      border-radius: 6px;
      padding: 2rem;
      text-align: center;
    }
    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      margin-bottom: 1.5rem;
    }
    .brand img { width: 30px; height: 30px; }
    .brand span { font-weight: 800; font-size: 1.2rem; }
    h1 { font-size: 1.3rem; font-weight: 900; margin-bottom: 0.4rem; }
    p { color: #666; font-size: 0.85rem; margin-bottom: 1.5rem; line-height: 1.5; }
    #captcha-host {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      min-height: 100px;
      justify-content: center;
    }
    #status { font-size: 0.85rem; font-weight: 600; margin-top: 1rem; min-height: 1.2em; }
    #status.ok { color: #34d399; }
    #status.err { color: #f87171; }
    .spin { animation: spin 0.8s linear infinite; display: inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <img src="/static/favicon.png" alt="" />
      <span>Prowl</span>
    </div>
    <h1>Human Verification</h1>
    <p>Complete the captcha below to be verified in the server.</p>
    <div id="captcha-host">
      <div id="status"></div>
    </div>
  </div>

  {% if provider == "recaptcha" %}
  <script src="https://www.google.com/recaptcha/api.js?render={{ site_key }}"></script>
  {% elif provider == "turnstile" %}
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  {% endif %}

  <script>
    const GID = "{{ guild_id }}";
    const PROVIDER = "{{ provider }}";
    const SITE_KEY = "{{ site_key }}";
    const USER_ID = "{{ user_id }}";
    const statusEl = document.getElementById('status');

    function setStatus(text, ok) {
      statusEl.textContent = text || '';
      statusEl.className = ok ? 'ok' : (text ? 'err' : '');
    }

    async function complete(token) {
      setStatus('Verifying...');
      try {
        const res = await fetch(`/api/v1/verify/${GID}/complete`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, user_id: USER_ID, provider: PROVIDER })
        });
        const data = await res.json();
        if (res.ok && data.ok) {
          setStatus('✅ Verified! You can close this page.', true);
        } else {
          setStatus('Verification failed. Please try again.', false);
        }
      } catch (e) {
        setStatus('Network error. Please try again.', false);
      }
    }

    // Cloudflare Turnstile
    if (PROVIDER === 'turnstile' && window.turnstile) {
      turnstile.render('captcha-host', {
        sitekey: SITE_KEY,
        callback: (token) => complete(token),
      });
    }
    // Google reCAPTCHA v2 checkbox
    if (PROVIDER === 'recaptcha' && window.grecaptcha) {
      grecaptcha.ready(() => {
        grecaptcha.render('captcha-host', {
          sitekey: SITE_KEY,
          theme: 'dark',
          callback: (token) => complete(token),
        });
      });
    }
  </script>
</body>
</html>
