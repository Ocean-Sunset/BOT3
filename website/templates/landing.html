<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prowl — We're Building Something</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
          colors: {
            surface: { 0: '#0f1117', 1: '#11131b', 2: '#151822', 3: '#191f2d' },
            brand: { DEFAULT: '#7c5cff', light: '#a78bfa' },
          },
        },
      },
    }
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <style>
    @keyframes dash {
      to { stroke-dashoffset: 0; }
    }
  </style>
</head>
<body class="bg-surface-0 text-[#e9edf5] font-sans antialiased min-h-screen overflow-hidden
             bg-[radial-gradient(1200px_600px_at_50%_30%,rgba(124,92,255,0.14),transparent_60%)]
             flex items-center justify-center p-6">

  <!-- Glow blobs -->
  <div class="fixed top-1/4 left-1/3 w-[500px] h-[500px] rounded-full bg-brand/[0.06] blur-[120px] pointer-events-none gsap-blob"></div>
  <div class="fixed bottom-1/4 right-1/4 w-[350px] h-[350px] rounded-full bg-violet-500/[0.04] blur-[100px] pointer-events-none gsap-blob"></div>

  <div class="relative flex flex-col items-center gap-10 text-center max-w-lg w-full">

    <!-- Animated logo -->
    <div class="gsap-logo relative">
      <div class="w-20 h-20 rounded-2xl grid place-items-center bg-brand/15 border border-brand/25 relative">
        <i data-lucide="paw-print" class="w-10 h-10 text-brand-light"></i>
        <!-- Orbiting ring -->
        <div class="absolute inset-[-14px] rounded-2xl border border-brand/10 gsap-ring"></div>
      </div>
    </div>

    <!-- Text -->
    <div class="flex flex-col items-center gap-4">
      <h1 class="gsap-title text-4xl sm:text-5xl font-black tracking-tight leading-tight">
        We're building<br/>
        <span class="text-brand-light">something</span>.
      </h1>
      <p class="gsap-sub text-white/40 text-base font-semibold leading-relaxed max-w-md">
        Prowl is a powerful Discord bot with moderation, leveling, AI, music, and more.<br/>
        The dashboard is coming soon.
      </p>
    </div>

    <!-- Links -->
    <div class="gsap-links flex flex-col sm:flex-row items-center gap-3">
      <a href="/dashboard"
         class="flex items-center gap-2.5 px-6 py-3 rounded-xl bg-brand/20 border border-brand/25 text-brand-light
                font-bold text-sm hover:bg-brand/30 transition-colors duration-200">
        <i data-lucide="layout-dashboard" class="w-4 h-4"></i>
        Open Dashboard
      </a>
      <a href="https://discord.com/oauth2/authorize?client_id={{ config.get('CLIENT_ID', '') }}&scope=bot&permissions=8"
         target="_blank" rel="noopener"
         class="flex items-center gap-2.5 px-6 py-3 rounded-xl bg-white/[0.04] border border-white/[0.08] text-white/60
                font-bold text-sm hover:bg-white/[0.07] hover:text-white/80 transition-colors duration-200">
        <i data-lucide="plus-circle" class="w-4 h-4"></i>
        Add to Server
      </a>
    </div>

    <!-- Status dots -->
    <div class="gsap-status flex items-center gap-4 text-xs font-semibold text-white/30">
      <span class="flex items-center gap-2">
        <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
        Bot Online
      </span>
      <span class="flex items-center gap-2">
        <span class="w-2 h-2 rounded-full bg-amber-400"></span>
        Dashboard In Progress
      </span>
    </div>
  </div>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    // ── Initial states ──
    gsap.set('.gsap-logo',   { opacity: 0, scale: 0.7 });
    gsap.set('.gsap-title',  { opacity: 0, y: 30 });
    gsap.set('.gsap-sub',    { opacity: 0, y: 20 });
    gsap.set('.gsap-links',  { opacity: 0, y: 20 });
    gsap.set('.gsap-status', { opacity: 0 });
    gsap.set('.gsap-blob',   { scale: 0.5, opacity: 0 });
    gsap.set('.gsap-ring',   { scale: 0.8, opacity: 0 });

    // ── Load timeline ──
    const tl = gsap.timeline({ defaults: { ease: 'power3.out' } });

    tl
      .to('.gsap-blob', { scale: 1, opacity: 1, duration: 1.5 }, 0)
      .to('.gsap-logo', { opacity: 1, scale: 1, duration: 0.6, ease: 'back.out(1.4)' }, 0.2)
      .to('.gsap-ring', { opacity: 1, scale: 1, duration: 0.8 }, 0.4)
      .to('.gsap-title', { opacity: 1, y: 0, duration: 0.5 }, 0.4)
      .to('.gsap-sub',   { opacity: 1, y: 0, duration: 0.45 }, 0.55)
      .to('.gsap-links', { opacity: 1, y: 0, duration: 0.45 }, 0.65)
      .to('.gsap-status', { opacity: 1, duration: 0.4 }, 0.8);

    // ── Ring rotate loop ──
    gsap.to('.gsap-ring', {
      rotation: 360,
      duration: 20,
      ease: 'none',
      repeat: -1,
    });

    // ── Blob drift ──
    document.querySelectorAll('.gsap-blob').forEach((blob, i) => {
      gsap.to(blob, {
        x: i === 0 ? 30 : -20,
        y: i === 0 ? -20 : 25,
        duration: 6 + i * 2,
        ease: 'sine.inOut',
        yoyo: true,
        repeat: -1,
      });
    });
  </script>
</body>
</html>
