{% extends "dashboard/base.html" %}
{% block content %}
<div style="padding:2rem 0;">
  <div style="margin-bottom:1.5rem;">
    <h1 style="font-size:26px;font-weight:900;letter-spacing:-0.03em;line-height:1.05;">Profile</h1>
    <p style="color:rgba(255,255,255,0.5);font-size:14px;font-weight:600;margin-top:4px;">Your Prowl account information</p>
  </div>

  <div class="md-row">
    <div class="md-section">
      <div style="border:1px solid rgba(255,255,255,0.08);border-radius:4px;background:rgba(255,255,255,0.015);padding:1.5rem;display:flex;flex-direction:column;align-items:center;text-align:center;gap:0.75rem;">
        <div style="width:88px;height:88px;border-radius:50%;overflow:hidden;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);flex-shrink:0;">
          <img id="prof-avatar" src="" style="width:100%;height:100%;object-fit:cover;" alt="" />
        </div>
        <div>
          <div id="prof-name" style="font-size:1.2rem;font-weight:900;letter-spacing:-0.02em;">—</div>
          <div id="prof-username" style="font-size:0.85rem;color:rgba(255,255,255,0.5);font-weight:600;">—</div>
        </div>
        <div style="font-size:0.72rem;color:rgba(255,255,255,0.35);font-weight:600;padding:0.3rem 0.8rem;border:1px solid rgba(255,255,255,0.08);border-radius:999px;" id="prof-id">—</div>
      </div>
    </div>

    <div class="md-section">
      <div style="border:1px solid rgba(255,255,255,0.08);border-radius:4px;background:rgba(255,255,255,0.015);padding:1rem;">
        <div style="font-size:0.85rem;font-weight:800;color:rgba(255,255,255,0.7);margin-bottom:0.75rem;letter-spacing:-0.01em;">Account</div>
        <div class="md-behavior-list">
          <div class="md-behavior-item" style="justify-content:space-between;">
            <span style="font-size:0.82rem;color:rgba(255,255,255,0.5);">User ID</span>
            <span style="font-size:0.82rem;font-weight:700;font-family:monospace;" id="prof-uid">—</span>
          </div>
          <div class="md-behavior-item" style="justify-content:space-between;">
            <span style="font-size:0.82rem;color:rgba(255,255,255,0.5);">Username</span>
            <span style="font-size:0.82rem;font-weight:700;" id="prof-uname">—</span>
          </div>
          <div class="md-behavior-item" style="justify-content:space-between;">
            <span style="font-size:0.82rem;color:rgba(255,255,255,0.5);">Display Name</span>
            <span style="font-size:0.82rem;font-weight:700;" id="prof-dname">—</span>
          </div>
          <div class="md-behavior-item" style="justify-content:space-between;">
            <span style="font-size:0.82rem;color:rgba(255,255,255,0.5);">Server</span>
            <span style="font-size:0.82rem;font-weight:700;" id="prof-server">—</span>
          </div>
        </div>
      </div>
    </div>

    <div class="md-section">
      <div style="border:1px solid rgba(255,255,255,0.08);border-radius:4px;background:rgba(255,255,255,0.015);padding:1rem;">
        <div style="font-size:0.85rem;font-weight:800;color:rgba(255,255,255,0.7);margin-bottom:0.75rem;letter-spacing:-0.01em;">Session</div>
        <div class="md-behavior-list">
          <div class="md-behavior-item" style="justify-content:space-between;">
            <span style="font-size:0.82rem;color:rgba(255,255,255,0.5);">Status</span>
            <span style="font-size:0.82rem;font-weight:700;color:#34d399;">Signed in</span>
          </div>
        </div>
        <a href="/logout" class="md-action-btn danger" style="width:100%;justify-content:center;margin-top:0.75rem;padding:0.55rem;"><i data-lucide="log-out"></i> Log Out</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
document.addEventListener('DOMContentLoaded', () => {
  const u = window.__USER || {};
  const g = window.__GUILD || {};
  const avatarUrl = u.avatar ? `https://cdn.discordapp.com/avatars/${u.id}/${u.avatar}.png?size=256` : `https://cdn.discordapp.com/embed/avatars/${parseInt(u.id||0)%5}.png`;
  document.getElementById('prof-avatar').src = avatarUrl;
  document.getElementById('prof-name').textContent = u.global_name || u.username || '—';
  document.getElementById('prof-username').textContent = u.username ? '@' + u.username : '—';
  document.getElementById('prof-id').textContent = 'ID ' + (u.id || '—');
  document.getElementById('prof-uid').textContent = u.id || '—';
  document.getElementById('prof-uname').textContent = u.username || '—';
  document.getElementById('prof-dname').textContent = u.global_name || u.username || '—';
  document.getElementById('prof-server').textContent = g.name || '—';
});
</script>
{% endblock %}
