{% extends "dashboard/base.html" %}
{% block content %}
<div class="music-blank">
  <div class="music-blank-text">working on it..</div>
</div>
<style>
  .music-blank {
    min-height: calc(100vh - 6rem);
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 10px;
    background-image: url('https://img.magnific.com/free-photo/closeup-cute-kitten-resting-sofa_181624-37234.jpg?semt=ais_hybrid&w=740&q=80');
    background-size: cover;
    background-position: center;
    position: relative;
  }
  .music-blank::before {
    content: '';
    position: absolute;
    inset: 0;
    background: rgba(10,10,12,0.4);
    border-radius: 10px;
  }
  .music-blank-text {
    position: relative;
    z-index: 1;
    font-size: 1.5rem;
    font-weight: 800;
    letter-spacing: -0.02em;
    color: #fff;
  }
</style>
{% endblock %}
